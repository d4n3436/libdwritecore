<!doctype html>
<meta charset="utf-8">
<title>DWriteCore SVG text parity, as a document</title>
<!--
  The badge as a document in an <iframe>, so its text takes the blob
  rasterizer. This is how a badge renders when its URL is opened in a tab of
  its own, and where the gamma split shows.

  One embed per page, for the reason svg-text.html gives about inline <svg>.
-->
<style>
  html, body { margin: 0; background: #fff; }
  body { width: 960px; }
  iframe { display: block; border: 0; }
</style>
<iframe src="svg-text-badge.svg" width="900" height="44" scrolling="no"></iframe>
